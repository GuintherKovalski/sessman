# The road every change takes: feature/* -> stage -> tests pass -> main.
#
# - A pull request into stage must come from a feature/* branch; one into main is refused
#   (main only moves by the promote job below).
# - Every push to stage runs the test suite; when it passes, main is fast-forwarded to
#   that commit. main is never pushed to by hand.
# - A push to main that is not a commit stage already has fails the "guard" job, so a
#   change that skipped the road shows up red on main.
# - When a promotion changes the version in Cargo.toml (scripts/flow.sh release <version>),
#   release.yml builds and publishes that version.
name: ci

on:
  push:
    branches: [stage, main]
  pull_request:
    branches: [stage, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/stage' }}

jobs:
  route:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check the pull request follows feature -> stage -> main
        env:
          HEAD: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
        run: |
          case "$BASE:$HEAD" in
            stage:feature/*) echo "ok: $HEAD -> stage" ;;
            main:*) echo "::error::main only moves when stage passes the tests; open the pull request into stage"; exit 1 ;;
            *) echo "::error::$HEAD -> $BASE: changes reach stage from a feature/* branch made from stage"; exit 1 ;;
          esac

  guard:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check main only holds commits stage has
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/stage; then
            echo "::error::main got $GITHUB_SHA, which stage does not have: it skipped feature -> stage -> tests"
            exit 1
          fi

  test:
    if: github.ref != 'refs/heads/main'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  # The same suite on Windows (the tests that need sh, pgrep or pkill are macOS's only), and
  # the release build, so a change that breaks the Windows app shows up before it ships.
  test-windows:
    if: github.ref != 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo build --release
      # The build, as a release ships it, for trying a change on Windows before it is released:
      # SCOPE_FROM=<unzipped artifact folder> packaging/install.ps1 installs it.
      - name: Zip the build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/release/scope.exe -DestinationPath dist/scope-windows-x64.zip
          $sum = (Get-FileHash -Algorithm SHA256 dist/scope-windows-x64.zip).Hash.ToLower()
          "$sum  scope-windows-x64.zip" | Out-File -Encoding ascii dist/SHA256SUMS
          Copy-Item packaging/install.ps1 dist/
      - uses: actions/upload-artifact@v4
        with:
          name: scope-windows-x64
          path: dist/

  promote:
    needs: [test, test-windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/stage'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Before the push below, which moves origin/main.
      - name: Release when the version changed
        id: version
        run: |
          version() { git show "$1:Cargo.toml" | sed -n 's/^version = "\(.*\)"/\1/p' | head -n 1; }
          new=$(version "$GITHUB_SHA")
          git fetch origin main
          old=$(version origin/main)
          if [ "$new" != "$old" ] && ! git ls-remote --exit-code --tags origin "refs/tags/v$new" >/dev/null; then
            echo "version $old -> $new: releasing v$new"
            echo "release=$new" >> "$GITHUB_OUTPUT"
          fi
      - name: Fast-forward main to the tested stage commit
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main "$GITHUB_SHA"; then
            echo "::error::main has commits stage lacks; it can't be fast-forwarded. Bring them into stage through a feature branch."
            exit 1
          fi
          git push origin "$GITHUB_SHA:refs/heads/main"

  release:
    needs: promote
    if: needs.promote.outputs.release != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.promote.outputs.release }}
      ref: ${{ github.sha }}
    secrets: inherit
