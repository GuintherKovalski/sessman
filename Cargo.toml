[package]
name = "sessman"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.36"
egui_commonmark = { version = "0.25", default-features = false, features = ["pulldown_cmark", "better_syntax_highlighting"] }
egui_extras = { version = "0.36", features = ["syntect"] }
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
similar = "3.2.0"
