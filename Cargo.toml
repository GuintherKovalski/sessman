[package]
name = "scope"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.36", features = ["persistence"] }
egui_commonmark = { version = "0.25", default-features = false, features = ["pulldown_cmark", "better_syntax_highlighting"] }
egui_extras = { version = "0.36", features = ["syntect", "file", "image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "tiff", "bmp"] }
base64 = "0.22"
libc = "0.2"
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
similar = "3.2.0"

[target.'cfg(target_os = "macos")'.dependencies]
cpal = "0.16"
whisper-rs = { version = "0.15", features = ["metal"] }
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSDictionary", "NSBundle", "NSError", "NSURL", "NSArray", "NSFileManager", "NSError", "NSData"] }
objc2-user-notifications = { version = "0.3", features = ["UNUserNotificationCenter", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSound", "UNNotificationTrigger", "block2"] }
objc2-app-kit = { version = "0.3", features = ["NSOpenPanel", "NSSavePanel", "NSPanel", "NSWindow", "NSResponder", "NSApplication", "NSPasteboard", "NSPasteboardItem", "NSEvent", "block2"] }

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["eframe"] }
